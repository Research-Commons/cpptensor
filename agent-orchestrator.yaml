$schema: https://raw.githubusercontent.com/ComposioHQ/agent-orchestrator/main/schema/config.schema.json
port: 3000
defaults:
  runtime: tmux
  agent: codex
  workspace: worktree
  notifiers: []
projects:
  cpptensor:
    name: cpptensor
    sessionPrefix: cpp
    repo: Research-Commons/cpptensor
    path: /home/shivy/Repos/cpptensor
    defaultBranch: main
    agentConfig:
      permissions: permissionless
      model: gpt-5.4
    agentRules: |-
      Always run tests before pushing.
      Use conventional commits (feat:, fix:, chore:, docs:, refactor:, test:).
      Link issue numbers in commit messages.
      Write clear commit messages that explain WHY, not just WHAT.
      Run all cpptensor configure, build, test, and benchmark commands through the dedicated conda environment, e.g. `conda run -n cpptensor ...`, or from an activated `cpptensor` environment.
      Ensure the environment is present before CMake work: `conda env update -n cpptensor -f environment.yml --prune` (or create it with `conda env create -f environment.yml` if it does not exist).
      Do not spawn or use Codex fast, spark, or mini models for this repo; use gpt-5.4 unless the human explicitly overrides the model.
    postCreate:
      - >-
        bash -lc 'if command -v conda >/dev/null 2>&1; then
        if conda env list | awk "{print \$1}" | grep -qx cpptensor; then
        conda env update -n cpptensor -f environment.yml --prune;
        else conda env create -f environment.yml; fi;
        else echo "conda not found; skipping cpptensor env setup"; fi'
