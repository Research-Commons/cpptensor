name: cpptensor-ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cpu-build-test:
    name: CPU build/test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            cxx_compiler: g++
            use_openblas: ON
          - name: ubuntu-clang
            os: ubuntu-latest
            cxx_compiler: clang++
            use_openblas: ON
          - name: macos-clang
            os: macos-latest
            cxx_compiler: clang++
            use_openblas: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cpptensor
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Show selected compiler versions
        run: |
          set -euo pipefail
          "${{ matrix.cxx_compiler }}" --version

      - name: Configure
        env:
          BUILD_DIR: build/${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          conda run -n cpptensor cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DCPPTENSOR_BUILD_TESTS=ON \
            -DBUILD_CUDA=OFF \
            -DUSE_OPENBLAS=${{ matrix.use_openblas }} \
            -DBUILD_AVX2=OFF \
            -DBUILD_AVX512=OFF 2>&1 | tee "${BUILD_DIR}/configure.log"
          actual_cxx="$(grep '^CMAKE_CXX_COMPILER:' "${BUILD_DIR}/CMakeCache.txt" | cut -d= -f2-)"
          echo "Configured C++ compiler: ${actual_cxx}" | tee -a "${BUILD_DIR}/configure.log"
          if [[ "${actual_cxx##*/}" != "${{ matrix.cxx_compiler }}" ]]; then
            echo "::error::Expected C++ compiler '${{ matrix.cxx_compiler }}' but CMake configured '${actual_cxx}'." | tee -a "${BUILD_DIR}/configure.log"
            exit 1
          fi

      - name: Build
        env:
          BUILD_DIR: build/${{ matrix.name }}
        run: |
          set -euo pipefail
          conda run -n cpptensor cmake --build "${BUILD_DIR}" --parallel 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Test
        env:
          BUILD_DIR: build/${{ matrix.name }}
        run: |
          set -euo pipefail
          conda run -n cpptensor ctest --test-dir "${BUILD_DIR}" --output-on-failure --no-tests=error 2>&1 | tee "${BUILD_DIR}/ctest.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            build/${{ matrix.name }}/configure.log
            build/${{ matrix.name }}/build.log
            build/${{ matrix.name }}/ctest.log
            build/${{ matrix.name }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.name }}/CMakeFiles/CMakeError.log
            build/${{ matrix.name }}/Testing/Temporary/LastTest.log

  feature-toggle-build:
    name: Feature toggles (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-openblas-off
            os: ubuntu-latest
            cxx_compiler: g++
            use_openblas: OFF
            build_avx2: OFF
            build_avx512: OFF
          - name: linux-avx2-on
            os: ubuntu-latest
            cxx_compiler: clang++
            use_openblas: ON
            build_avx2: ON
            build_avx512: OFF
          - name: linux-avx512-on
            os: ubuntu-latest
            cxx_compiler: g++
            use_openblas: ON
            build_avx2: OFF
            build_avx512: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cpptensor
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Configure
        env:
          BUILD_DIR: build/${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          conda run -n cpptensor cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DBUILD_CUDA=OFF \
            -DUSE_OPENBLAS=${{ matrix.use_openblas }} \
            -DBUILD_AVX2=${{ matrix.build_avx2 }} \
            -DBUILD_AVX512=${{ matrix.build_avx512 }} 2>&1 | tee "${BUILD_DIR}/configure.log"
          actual_cxx="$(grep '^CMAKE_CXX_COMPILER:' "${BUILD_DIR}/CMakeCache.txt" | cut -d= -f2-)"
          echo "Configured C++ compiler: ${actual_cxx}" | tee -a "${BUILD_DIR}/configure.log"
          if [[ "${actual_cxx##*/}" != "${{ matrix.cxx_compiler }}" ]]; then
            echo "::error::Expected C++ compiler '${{ matrix.cxx_compiler }}' but CMake configured '${actual_cxx}'." | tee -a "${BUILD_DIR}/configure.log"
            exit 1
          fi

      - name: Build
        env:
          BUILD_DIR: build/${{ matrix.name }}
        run: |
          set -euo pipefail
          conda run -n cpptensor cmake --build "${BUILD_DIR}" --target cpptensor --parallel 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            build/${{ matrix.name }}/configure.log
            build/${{ matrix.name }}/build.log
            build/${{ matrix.name }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.name }}/CMakeFiles/CMakeError.log

  sanitizer-warning-gate:
    name: Sanitizer + warning gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cpptensor
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Configure sanitizer build
        env:
          BUILD_DIR: build/sanitizer-warning-gate
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          conda run -n cpptensor cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCPPTENSOR_BUILD_TESTS=ON \
            -DBUILD_CUDA=OFF \
            -DUSE_OPENBLAS=OFF \
            -DBUILD_AVX2=OFF \
            -DBUILD_AVX512=OFF \
            -DCPPTENSOR_ENABLE_ASAN=ON \
            -DCPPTENSOR_ENABLE_UBSAN=ON \
            -DCPPTENSOR_ENABLE_STRICT_WARNINGS=ON \
            -DCPPTENSOR_WARNINGS_AS_ERRORS=ON 2>&1 | tee "${BUILD_DIR}/configure.log"
          actual_cxx="$(grep '^CMAKE_CXX_COMPILER:' "${BUILD_DIR}/CMakeCache.txt" | cut -d= -f2-)"
          echo "Configured C++ compiler: ${actual_cxx}" | tee -a "${BUILD_DIR}/configure.log"
          if [[ "${actual_cxx##*/}" != "g++" ]]; then
            echo "::error::Expected C++ compiler 'g++' but CMake configured '${actual_cxx}'." | tee -a "${BUILD_DIR}/configure.log"
            exit 1
          fi

      - name: Build sanitizer targets
        env:
          BUILD_DIR: build/sanitizer-warning-gate
        run: |
          set -euo pipefail
          conda run -n cpptensor cmake --build "${BUILD_DIR}" --parallel 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Test sanitizer targets
        env:
          BUILD_DIR: build/sanitizer-warning-gate
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          conda run -n cpptensor ctest --test-dir "${BUILD_DIR}" --output-on-failure --no-tests=error 2>&1 | tee "${BUILD_DIR}/ctest.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sanitizer-warning-gate
          if-no-files-found: ignore
          path: |
            build/sanitizer-warning-gate/configure.log
            build/sanitizer-warning-gate/build.log
            build/sanitizer-warning-gate/ctest.log
            build/sanitizer-warning-gate/CMakeFiles/CMakeOutput.log
            build/sanitizer-warning-gate/CMakeFiles/CMakeError.log
            build/sanitizer-warning-gate/Testing/Temporary/LastTest.log

  optional-cuda-build:
    name: Optional CUDA leg (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cpptensor
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.5.0'
          method: network

      - name: Install CUDA-compatible host compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Show nvcc version
        run: nvcc --version

      - name: Configure CUDA build
        env:
          BUILD_DIR: build/cuda-optional
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          conda run -n cpptensor cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CUDA=ON \
            -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-13 \
            -DCMAKE_CUDA_FLAGS=--allow-unsupported-compiler \
            -DUSE_OPENBLAS=ON \
            -DBUILD_AVX2=OFF \
            -DBUILD_AVX512=OFF 2>&1 | tee "${BUILD_DIR}/configure.log"

      - name: Build CUDA target
        env:
          BUILD_DIR: build/cuda-optional
        run: |
          set -euo pipefail
          conda run -n cpptensor cmake --build "${BUILD_DIR}" --target cpptensor --parallel 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-cuda-optional
          if-no-files-found: ignore
          path: |
            build/cuda-optional/configure.log
            build/cuda-optional/build.log
            build/cuda-optional/CMakeFiles/CMakeOutput.log
            build/cuda-optional/CMakeFiles/CMakeError.log
